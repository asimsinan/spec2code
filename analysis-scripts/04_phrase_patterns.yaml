# Conservative phrase patterns used by the bubble-corpus analysis scripts.
#
# These patterns are the **exact** strict-tier patterns used to produce the
# paper's framework-effectiveness rates and strict cross-family rates. Editing
# them will produce different numbers.
#
# A bubble is counted for a category if any of its patterns appears as a
# case-insensitive substring anywhere in the bubble's JSON value (including
# the `text` field, `codeBlocks[*].content`, and other string payloads).
#
# These patterns are deliberately conservative: paraphrased variants are not
# counted, so reported rates are lower bounds. See the Reliability subsection
# of the paper's Threats to Validity for discussion of false-negative sources,
# cross-response context, and adversarial robustness.

Permission Seeking:
  - "should i continue"
  - "shall i continue"
  - "would you like me to"
  - "may i proceed"

Apology Theater:
  - "i sincerely apologize"
  - "my sincere apologies"

Retroactive Honesty:
  - "didn't actually"
  - "haven't actually"

Time Constraint Excuse:
  - "due to time constraint"
  - "to save time"
  - "for the sake of time"

Progress Theater:
  - "progress update"
  - "status update"

Efficiency Excuse:
  - "for efficiency"
  - "to be efficient"

Deferred Implementation:
  - "will implement in phase"
  - "in a future phase"
  - "later phase"

Task Reordering:
  - "let me prioritize"

Scope Creep Deflection:
  - "out of scope"
  - "separate project"

Premature Optimization:
  - "should i continue with the remaining"
