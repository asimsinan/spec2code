# Semantic anchor sentences per evasion category.
#
# Each category has 2-4 short natural-language sentences that exemplify the
# pattern. Script 06_semantic_presence.py encodes each bubble with a
# sentence-transformer, computes cosine similarity against every anchor, and
# counts the bubble for a category if ANY anchor similarity >= threshold
# (default 0.55).
#
# Design principles:
#   - Anchors must be short (the default encoder truncates at 256 tokens).
#   - Anchors should be grammatical, first-person, developer-addressed sentences.
#   - Avoid category names as anchors (cosine similarity would dominate).
#   - Prefer 2-3 distinct phrasings per category to capture variation.

